<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay | Operator handoff</title><style>body{margin:0;background:#f4f6f9;color:#15243b;font:15px system-ui,sans-serif}.bar{background:#15243b;color:#fff;padding:18px max(24px,calc((100% - 1100px)/2));font-weight:700}.main{max-width:1100px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.card{background:#fff;border:1px solid #d7dee8;border-radius:10px;padding:22px}h1{font-size:24px;margin:0 0 8px}p{color:#5f6f82}img{width:100%;border:1px solid #d7dee8;border-radius:6px}label{display:block;font-weight:700;margin:14px 0 7px}input,button{font:inherit;padding:10px;border-radius:6px}input{border:1px solid #aab8c9;width:100%}button{border:0;background:#1e4f91;color:#fff;font-weight:700;margin:12px 8px 0 0;cursor:pointer}.status{background:#edf3fb;padding:12px;border-radius:6px;white-space:pre-wrap}.warning{color:#b42318;font-weight:700}</style></head><body><div class="bar">Relay · Operator handoff</div><main class="main"><section class="card"><h1>Live automation session</h1><p class="warning">Automation is paused. Manual actions below operate the retained Playwright page, then automation resumes only after its checkpoint passes.</p><img id="preview" alt="Current live session screenshot"></section><section class="card"><h2 id="title">Loading intervention…</h2><div id="status" class="status"></div><label for="member">Member number</label><input id="member" placeholder="Enter correction"><button onclick="act('fill_member_number')">Fill live session</button><button onclick="act('click_search')">Click Search</button><br><button onclick="resume()">Resume automation</button></section></main><script>const id=location.pathname.split('/').pop(),$=s=>document.querySelector(s);async function load(){const h=await fetch('/api/handoffs/'+id).then(r=>r.json());$('#title').textContent='Intervention: '+h.code;$('#status').textContent=`Status: ${h.status}\nStep: ${h.stepId}\nReason: ${h.observed}`;if(h.preview)$('#preview').src=h.preview}async function act(action){const body={action};if(action==='fill_member_number')body.value=$('#member').value;const r=await fetch('/api/handoffs/'+id+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)alert((await r.json()).error);await load()}async function resume(){const r=await fetch('/api/handoffs/'+id+'/resume',{method:'POST'});const x=await r.json();if(!r.ok)alert(x.error);else{$('#status').textContent=`Completed after handoff. Output: ${x.outputs.savingsBalance}`;await load()}}load();setInterval(load,3000)</script></body></html>
